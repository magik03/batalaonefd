<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الإدارة الاحترافية - سوبير إعلام آلي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4e73df;
            --success: #1cc88a;
            --dark: #2d3436;
            --bg: #f0f2f5;
            --white: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        /* حاوية الواجهة الرئيسية */
        .admin-dashboard {
            background: var(--white);
            width: 95%;
            max-width: 800px;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* خط زخرفي علوي */
        .admin-dashboard::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--primary), var(--success));
        }

        .header-section {
            margin-bottom: 35px;
        }

        .header-section i {
            background: #f8f9fc;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            color: var(--primary);
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(78,115,223,0.1);
        }

        .header-section h2 {
            font-weight: 900;
            font-size: 28px;
            margin: 0;
            color: var(--dark);
        }

        .header-section p {
            color: #777;
            font-size: 16px;
        }

        /* نظام الكروت (Buttons) */
        .grid-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* تحسين التجاوب لتسع 3 كروت */
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-card {
            background: var(--white);
            border: 2px solid #edf2f7;
            padding: 25px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--dark);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .nav-card:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .nav-card img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: contain;
        }

        .nav-card span {
            font-weight: 700;
            font-size: 18px;
        }

        .nav-card .badge {
            font-size: 12px;
            background: #eef2ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: bold;
        }

        /* زر العودة */
        .footer-link {
            margin-top: 20px;
            display: inline-block;
            color: #888;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .footer-link:hover {
            color: var(--primary);
        }

        @media (max-width: 600px) {
            .grid-links { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="admin-dashboard">
        <div class="header-section">
            <i class="fas fa-user-shield fa-2x"></i>
            <h2>بوابة التحكم المركزية 🔒</h2>
            <p>مرحباً بك في لوحة الإدارة دمانة السحابية - سوبير إعلام آلي</p>
        </div>

        <div class="grid-links">
            <!-- كرت المراسلة -->
            <a href="form-morasala.html" class="nav-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNAUyxIcXbp_YvkBbIwde2mFtUWXhmmGcUmg&s" alt="ONEFD">
                <span>تسجيلات مراسلة</span>
                <div class="badge">ONEFD</div>
            </a>

            <!-- كرت البطالة -->
            <a href="form-batala.html" class="nav-card">
                <img src="https://img.sur.ly/favicons/a/anem.dz.ico" alt="ANEM">
                <span>تسجيلات البطالة</span>
                <div class="badge">ANEM</div>
            </a>

            <!-- كرت الحج والعمرة (الجديد) -->
            <a href="form-hadj.html" class="nav-card"> <!-- تأكد أن اسم الملف صحيح -->
                <img src="https://cdn-icons-png.flaticon.com/512/2319/2319886.png" alt="Hajj">
                <span>الحج والعمرة</span>
                <div class="badge">موسم 2026</div>
            </a>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <a href="index.html" class="footer-link">
            <i class="fas fa-sign-out-alt"></i> الخروج والعودة لصفحة التسجيل
        </a>
    </div>

</body>
</html>
