<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة ملفات المراسلة - سوبير إعلام آلي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4e73df; --success: #1cc88a; --danger: #e74a3b; --warning: #f6c23e; --dark: #2e59d9; --gray-dark: #5a5c69; }
        body { font-family: 'Cairo', sans-serif; background: #f8f9fc; margin: 0; direction: rtl; }
        
        .header { background: var(--primary); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: rgba(255, 255, 255, 0.2); color: white; text-decoration: none; padding: 8px 20px; border-radius: 10px; font-weight: bold; }

        .controls-section { padding: 20px 40px; background: white; border-bottom: 1px solid #e3e6f0; }
        .search-input { width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #eaecf4; border-radius: 10px; font-family: 'Cairo'; font-size: 16px; outline: none; margin-bottom: 15px; }

        .filters-wrapper { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .filter-label { font-weight: bold; color: var(--gray-dark); font-size: 14px; }
        .filter-chip { padding: 6px 15px; border-radius: 20px; background: #eaecf4; color: #4e73df; cursor: pointer; border: 1px solid transparent; font-size: 13px; font-weight: bold; transition: 0.3s; font-family: 'Cairo'; }
        .filter-chip:hover { background: #dddfeb; }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--dark); }
        .filter-chip.special { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .filter-chip.special.active { background: #f6c23e; color: white; }

        .counter { margin-right: auto; font-weight: bold; color: var(--gray-dark); font-size: 14px; }

        .table-container { padding: 20px 40px; overflow-x: auto; }
        table { width: 100%; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-collapse: collapse; min-width: 1300px; }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f1f4f9; color: #333; font-weight: 900; }
        .ltr { direction: ltr; unicode-bidi: plain; }
        .muted { color: #aaa; }
        .notes-cell { max-width: 180px; text-align: right; font-size: 13px; color: #555; white-space: pre-wrap; word-break: break-word; }

        .cred { display: inline-flex; align-items: center; gap: 6px; background: #f1f4f9; padding: 4px 10px; border-radius: 8px; font-family: monospace; }
        .cred i { cursor: pointer; color: var(--primary); }
        
        .steps-wrapper { display: flex; gap: 4px; justify-content: center; }
        .step-btn { padding: 5px 8px; border-radius: 6px; border: 1px solid #ddd; background: #f8f9fc; color: #888; font-size: 10px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; }
        .step-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }

        .status-pill { 
            padding: 8px 15px; border-radius: 50px; font-weight: bold; font-size: 12px; cursor: pointer; 
            background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; display: inline-block;
        }

        .btn-action { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; color: white; margin: 2px; }

        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:20px; width:95%; max-width:700px; max-height: 90vh; overflow-y: auto; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .editor-grid .full { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 4px; text-align: right; }
        input, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; font-size: 14px; }

        @media (max-width: 600px) {
            .header, .controls-section, .table-container { padding-left: 15px; padding-right: 15px; }
            .editor-grid { grid-template-columns: 1fr; }
            .editor-grid .full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fas fa-graduation-cap"></i> إدارة ملفات المراسلة</h2>
        <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
    </div>

    <div class="controls-section">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث بالاسم أو الهاتف أو البريد أو اسم المستخدم أو رقم الاستمارة..." onkeyup="applyFilters()">
        
        <div class="filters-wrapper">
            <span class="filter-label"><i class="fas fa-filter"></i> تصفية:</span>
            <div id="statusFilters" style="display: flex; gap: 8px;">
                <button class="filter-chip active" id="btnAll" onclick="filterBy('all', this)">الكل</button>
                <button class="filter-chip special" onclick="filterBy('eQuiz', this)">أتموا الفرض الإلكتروني ✅</button>
            </div>
            <div id="dynamicStatusFilters" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
            <span class="counter" id="counter"></span>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>الاسم واللقب</th>
                    <th>الهاتف</th>
                    <th>البريد الإلكتروني</th>
                    <th>رقم الاستمارة</th>
                    <th>اسم المستخدم</th>
                    <th>كلمة المرور</th>
                    <th>ملاحظات</th>
                    <th>متابعة الفروض (تفاعلي)</th>
                    <th>الحالة</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>

    <!-- نافذة التعديل -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin:0">تعديل معلومات المترشح 🖊️</h3>
            <div id="editor" class="editor-grid"></div>
            <button onclick="saveData()" style="width:100%; background:var(--primary); color:white; padding:15px; border-radius:10px; border:none; margin-top:20px; cursor:pointer; font-weight:bold; font-family:'Cairo';">حفظ التغييرات</button>
            <button onclick="closeModal()" style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer; font-family:'Cairo';">إغلاق</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyCCvmqKN3nYQubL6LZYtMY6UtGv-T_fOg8", authDomain: "batalaonefd.firebaseapp.com", 
        projectId: "batalaonefd", storageBucket: "batalaonefd.firebasestorage.app", 
        messagingSenderId: "346007854663", appId: "1:346007854663:web:2d508e74c073061ee31b62" 
    };

    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let master = []; 
    let currentFilterType = 'all';
    let currentStatusFilter = null;

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dash = '<span class="muted">---</span>';

    onSnapshot(collection(db, "registrations"), (snap) => {
        master = [];
        snap.forEach(d => {
            const data = d.data();
            if(data.serviceType === 'مراسلة') master.push({ id: d.id, ...data });
        });
        
        generateStatusFilters();
        applyFilters();
    });

    function generateStatusFilters() {
        const container = document.getElementById('dynamicStatusFilters');
        const uniqueStatuses = [...new Set(master.map(item => item.status).filter(s => s))];
        
        container.innerHTML = "";
        uniqueStatuses.forEach(status => {
            const b = document.createElement('button');
            b.className = 'filter-chip' + (currentStatusFilter === status ? ' active' : '');
            b.textContent = status;
            b.onclick = () => filterByStatus(status, b);
            container.appendChild(b);
        });
    }

    window.filterBy = (type, btn) => {
        currentFilterType = type;
        currentStatusFilter = null;
        updateFilterUI(btn);
        applyFilters();
    };

    window.filterByStatus = (status, btn) => {
        currentFilterType = 'status';
        currentStatusFilter = status;
        updateFilterUI(btn);
        applyFilters();
    };

    function updateFilterUI(activeBtn) {
        document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
        activeBtn.classList.add('active');
    }

    window.applyFilters = () => {
        const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
        
        let filtered = master.filter(item => {
            const haystack = [item.fullName, item.phone, item.email, item.username, item.formId]
                .map(v => String(v ?? '').toLowerCase()).join(' ');
            const matchesSearch = haystack.includes(searchVal);
            const finishedQuiz = (item.e1 === true || item.e2 === true);

            if (currentFilterType === 'eQuiz') return matchesSearch && finishedQuiz;
            if (currentFilterType === 'status') return matchesSearch && item.status === currentStatusFilter;
            return matchesSearch;
        });

        filtered.sort((a, b) => {
            const aFinished = (a.e1 === true || a.e2 === true) ? 1 : 0;
            const bFinished = (b.e1 === true || b.e2 === true) ? 1 : 0;
            return bFinished - aFinished;
        });

        document.getElementById('counter').textContent = `العدد: ${filtered.length}`;
        renderTable(filtered);
    };

    function renderTable(dataList) {
        const body = document.getElementById('tBody');
        body.innerHTML = "";
        
        dataList.forEach(data => {
            const steps = [
                {k:'f1', l:'الفرض 1'}, {k:'t1', l:'تصحيح 1'}, {k:'e1', l:'إلكتروني 1'},
                {k:'f2', l:'الفرض 2'}, {k:'t2', l:'تصحيح 2'}, {k:'e2', l:'إلكتروني 2'}
            ];

            let stepsHtml = '<div class="steps-wrapper">';
            steps.forEach(s => {
                const active = data[s.k] === true;
                stepsHtml += `<button class="step-btn ${active?'active':''}" onclick="toggleStep('${data.id}','${s.k}',${active})">${s.l}</button>`;
            });
            stepsHtml += '</div>';

            const phone = data.phone ? `<a class="ltr" href="tel:${esc(data.phone)}" style="color:inherit;text-decoration:none">${esc(data.phone)}</a>` : dash;
            const email = data.email ? `<span class="ltr">${esc(data.email)}</span>` : dash;
            const user = data.username ? `<span class="cred ltr">${esc(data.username)} <i class="fas fa-copy" title="نسخ" onclick="copyText(this, '${data.id}', 'username')"></i></span>` : dash;
            const pass = data.password ? `<span class="cred ltr">${esc(data.password)} <i class="fas fa-copy" title="نسخ" onclick="copyText(this, '${data.id}', 'password')"></i></span>` : dash;

            body.innerHTML += `
                <tr style="${(data.e1 || data.e2) ? 'background: #f0f4ff' : ''}">
                    <td style="font-weight:bold">${esc(data.fullName) || dash}</td>
                    <td>${phone}</td>
                    <td>${email}</td>
                    <td>${esc(data.formId) || dash}</td>
                    <td>${user}</td>
                    <td>${pass}</td>
                    <td class="notes-cell">${esc(data.notes) || dash}</td>
                    <td>${stepsHtml}</td>
                    <td>
                        <div class="status-pill" onclick="quickEditStatus('${data.id}')">
                            ${esc(data.status) || 'أدخل الحالة 🖊️'}
                        </div>
                    </td>
                    <td>
                        <button class="btn-action" style="background:var(--primary)" onclick="openEdit('${data.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-action" style="background:var(--danger)" onclick="delDoc('${data.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
        });
    }

    window.copyText = async (icon, id, field) => {
        const item = master.find(m => m.id === id);
        try {
            await navigator.clipboard.writeText(item?.[field] || '');
            icon.className = 'fas fa-check';
            setTimeout(() => icon.className = 'fas fa-copy', 1200);
        } catch (e) {}
    };

    window.quickEditStatus = async (id) => {
        const old = master.find(m => m.id === id)?.status || '';
        const newVal = prompt("اكتب الحالة الجديدة:", old);
        if (newVal !== null) await updateDoc(doc(db, "registrations", id), { status: newVal });
    };

    window.toggleStep = async (id, field, val) => {
        await updateDoc(doc(db, "registrations", id), { [field]: !val });
    };

    window.openEdit = (id) => {
        window.currentEditID = id;
        const data = master.find(m => m.id === id);
        const editor = document.getElementById('editor'); editor.innerHTML = "";
        const fields = [
            { id: "fullName", label: "الاسم واللقب", full: true },
            { id: "phone", label: "رقم الهاتف", ltr: true },
            { id: "email", label: "البريد الإلكتروني (اختياري)", ltr: true },
            { id: "username", label: "اسم المستخدم", ltr: true },
            { id: "password", label: "كلمة المرور", ltr: true },
            { id: "formId", label: "رقم الاستمارة (اختياري)" },
            { id: "status", label: "الحالة" },
            { id: "notes", label: "ملاحظات إضافية", full: true, area: true }
        ];
        fields.forEach(f => {
            const val = esc(data[f.id] || '');
            const style = f.ltr ? 'style="direction:ltr;text-align:right"' : '';
            const control = f.area
                ? `<textarea id="inp_${f.id}" rows="3">${val}</textarea>`
                : `<input type="text" id="inp_${f.id}" value="${val}" ${style}>`;
            editor.innerHTML += `<div class="input-group ${f.full ? 'full' : ''}"><label>${f.label}</label>${control}</div>`;
        });
        document.getElementById('editModal').style.display = 'flex';
    };

    window.saveData = async () => {
        const updates = {};
        document.querySelectorAll('#editor input, #editor textarea').forEach(i => updates[i.id.replace('inp_','')] = i.value.trim());
        await updateDoc(doc(db, "registrations", window.currentEditID), updates);
        window.closeModal();
    };

    window.closeModal = () => document.getElementById('editModal').style.display='none';
    window.delDoc = async (id) => { if(confirm("هل أنت متأكد من الحذف؟")) await deleteDoc(doc(db, "registrations", id)); };
</script>
</body>
</html>
