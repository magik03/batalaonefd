<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة ملفات المراسلة - سوبير إعلام آلي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4e73df; --success: #1cc88a; --danger: #e74a3b; --warning: #f6c23e; --dark: #2e59d9; }
        body { font-family: 'Cairo', sans-serif; background: #f8f9fc; margin: 0; direction: rtl; }
        
        .header { background: var(--primary); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: rgba(255, 255, 255, 0.2); color: white; text-decoration: none; padding: 8px 20px; border-radius: 10px; font-weight: bold; }

        .search-container { padding: 20px 40px; background: white; border-bottom: 1px solid #e3e6f0; }
        .search-input { width: 100%; padding: 12px; border: 2px solid #eaecf4; border-radius: 10px; font-family: 'Cairo'; font-size: 16px; outline: none; }

        .table-container { padding: 20px 40px; overflow-x: auto; }
        table { width: 100%; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #f1f4f9; color: #333; font-weight: 900; }
        
        /* ستايل أزرار المراحل */
        .steps-wrapper { display: flex; gap: 4px; justify-content: center; }
        .step-btn { padding: 5px 8px; border-radius: 6px; border: 1px solid #ddd; background: #f8f9fc; color: #888; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .step-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }

        /* ستايل فقاعة الحالة (مثل الصورة) */
        .status-pill { 
            padding: 8px 15px; border-radius: 50px; font-weight: bold; font-size: 13px; cursor: pointer; 
            background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; display: inline-block; transition: 0.2s;
        }
        .status-pill:hover { background: #c1d7cd; transform: scale(1.03); }

        .btn-action { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; color: white; margin: 2px; }

        /* Modal Styles */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:20px; width:95%; max-width:700px; max-height: 90vh; overflow-y: auto; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; text-align: right; }
        .input-wrapper { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; }
        .copy-btn { background: #f1f4f9; border: 1px solid #ddd; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fas fa-graduation-cap"></i> إدارة ملفات المراسلة</h2>
        <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن اسم المترشح هنا..." onkeyup="filterTable()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>المستوى</th>
                    <th>متابعة الفروض (تفاعلي)</th>
                    <th>الحالة (اضغط للتعديل السريع 🖊️)</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>

    <!-- نافذة التعديل الشامل -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin:0">تعديل معلومات المترشح 🖊️</h3>
            <div id="editor" class="editor-grid"></div>
            <button onclick="saveData()" style="width:100%; background:var(--primary); color:white; padding:15px; border-radius:10px; border:none; margin-top:20px; cursor:pointer; font-weight:bold;">حفظ التغييرات</button>
            <button onclick="closeModal()" style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer;">إلغلاق</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyCCvmqKN3nYQubL6LZYtMY6UtGv-T_fOg8", authDomain: "batalaonefd.firebaseapp.com", 
        projectId: "batalaonefd", storageBucket: "batalaonefd.firebasestorage.app", 
        messagingSenderId: "346007854663", appId: "1:346007854663:web:2d508e74c073061ee31b62" 
    };

    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let master = []; let curID = "";

    onSnapshot(collection(db, "registrations"), (snap) => {
        master = [];
        snap.forEach(d => {
            const data = d.data();
            if(data.serviceType === 'مراسلة') master.push({ id: d.id, ...data });
        });
        renderTable(master);
    });

    function renderTable(dataList) {
        const body = document.getElementById('tBody');
        body.innerHTML = "";
        
        dataList.forEach(data => {
            const steps = [
                {k:'f1', l:'الفرض 1'}, {k:'t1', l:'تصحيح 1'}, {k:'e1', l:'إلكتروني 1'},
                {k:'f2', l:'الفرض 2'}, {k:'t2', l:'تصحيح 2'}, {k:'e2', l:'إلكتروني 2'}
            ];

            let stepsHtml = '<div class="steps-wrapper">';
            steps.forEach(s => {
                const active = data[s.k] === true;
                stepsHtml += `<button class="step-btn ${active?'active':''}" onclick="toggleStep('${data.id}','${s.k}',${active})">${s.l}</button>`;
            });
            stepsHtml += '</div>';

            body.innerHTML += `
                <tr>
                    <td style="font-weight:bold">${data.fullName || '---'}</td>
                    <td>${data.level || '---'}</td>
                    <td>${stepsHtml}</td>
                    <td>
                        <div class="status-pill" onclick="quickEditStatus('${data.id}', '${data.status || ''}')">
                            ${data.status || 'أدخل الحالة 🖊️'}
                        </div>
                    </td>
                    <td>
                        <button class="btn-action" style="background:var(--primary)" onclick="openEdit('${data.id}')" title="تعديل شامل"><i class="fas fa-edit"></i></button>
                        <button class="btn-action" style="background:var(--danger)" onclick="delDoc('${data.id}')" title="حذف"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
        });
    }

    // تعديل الحالة بنقرة زر واحدة من الواجهة
    window.quickEditStatus = async (id, old) => {
        const newVal = prompt("اكتب الحالة الجديدة (مثال: تم التسجيل | تحميل الفروض):", old);
        if (newVal !== null) await updateDoc(doc(db, "registrations", id), { status: newVal });
    };

    // تفعيل أزرار الفروض
    window.toggleStep = async (id, field, val) => {
        await updateDoc(doc(db, "registrations", id), { [field]: !val });
    };

    // فتح نافذة التعديل الشامل
    window.openEdit = (id) => {
        curID = id; const data = master.find(m => m.id === id);
        const editor = document.getElementById('editor'); editor.innerHTML = "";
        const fields = [
            { id: "fullName", label: "الاسم الكامل" }, { id: "formId", label: "رقم الاستمارة" },
            { id: "level", label: "المستوى الدراسي" }, { id: "username", label: "اسم المستخدم" },
            { id: "password", label: "كلمة السر" }, { id: "externalLink", label: "رابط الملف" },
            { id: "notes", label: "ملاحظات إضافية" }
        ];
        fields.forEach(f => {
            editor.innerHTML += `<div class="input-group"><label>${f.label}</label>
                <div class="input-wrapper"><input type="text" id="inp_${f.id}" value="${data[f.id]||''}">
                <button class="copy-btn" onclick="copyText('inp_${f.id}')"><i class="fas fa-copy"></i></button></div></div>`;
        });
        document.getElementById('editModal').style.display = 'flex';
    };

    window.copyText = (id) => {
        const inp = document.getElementById(id); inp.select(); document.execCommand("copy");
        alert("تم نسخ: " + inp.value);
    };

    window.saveData = async () => {
        const updates = {};
        document.querySelectorAll('#editor input').forEach(i => updates[i.id.replace('inp_','')] = i.value);
        await updateDoc(doc(db, "registrations", curID), updates);
        closeModal();
    };

    window.filterTable = () => {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = master.filter(item => item.fullName.toLowerCase().includes(query));
        renderTable(filtered);
    };

    window.closeModal = () => document.getElementById('editModal').style.display='none';
    window.delDoc = async (id) => { if(confirm("هل أنت متأكد من الحذف؟")) await deleteDoc(doc(db, "registrations", id)); };
</script>
</body>
</html>
