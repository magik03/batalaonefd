<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة ملفات المراسلة - سوبير إعلام آلي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4e73df; --success: #1cc88a; --danger: #e74a3b; --warning: #f6c23e; --dark: #2e59d9; }
        body { font-family: 'Cairo', sans-serif; background: #f8f9fc; margin: 0; direction: rtl; }
        
        .header { background: var(--primary); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: rgba(255, 255, 255, 0.2); color: white; text-decoration: none; padding: 8px 20px; border-radius: 10px; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        /* شريط البحث */
        .search-container { padding: 20px 40px; background: white; border-bottom: 1px solid #e3e6f0; display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 12px 20px; border: 2px solid #eaecf4; border-radius: 10px; font-family: 'Cairo'; font-size: 16px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: var(--primary); }

        .table-container { padding: 20px 40px; overflow-x: auto; }
        table { width: 100%; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #f1f4f9; color: #333; font-weight: 900; position: sticky; top: 0; }
        
        .status-pill { padding: 4px 12px; border-radius: 50px; font-weight: bold; font-size: 12px; white-space: nowrap; }
        .notes-text { font-size: 12px; color: #666; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Modal Styles */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:20px; width:95%; max-width:700px; max-height: 90vh; overflow-y: auto; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-wrapper { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; }
        
        .copy-btn { background: #f1f4f9; border: 1px solid #ddd; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
        .opt-btn { padding: 10px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; font-weight: bold; flex: 1; transition: 0.3s; }
        .active { border-color: black; transform: scale(1.05); }
        .btn-action { border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fas fa-graduation-cap"></i> إدارة ملفات المراسلة</h2>
        <a href="index.html" class="back-btn"><i class="fas fa-home"></i> الرئيسية</a>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن اسم المترشح هنا..." onkeyup="filterTable()">
    </div>

    <div class="table-container">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>الاستمارة</th>
                    <th>المستوى</th>
                    <th>الرابط</th>
                    <th>الملاحظات</th> <th>الحالة</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin:0">تعديل البيانات 🖊️</h3>
            <div id="editor" class="editor-grid"></div>
            <div style="margin-top:20px;">
                <label><b>الحالة:</b></label>
                <div style="display:flex; gap:10px; margin-top:8px;">
                    <button class="opt-btn" style="background:var(--success); color:white" onclick="setSt('تم التسجيل ✅')">تم ✅</button>
                    <button class="opt-btn" style="background:var(--warning)" onclick="setSt('قيد الانتظار ⏳')">انتظار ⏳</button>
                    <button class="opt-btn" style="background:var(--danger); color:white" onclick="setSt('مرفوض ❌')">رفض ❌</button>
                </div>
            </div>
            <input type="hidden" id="selectedStatus">
            <button onclick="saveData()" style="width:100%; background:var(--primary); color:white; padding:15px; border-radius:10px; border:none; margin-top:20px; cursor:pointer; font-weight:bold;">حفظ التغييرات</button>
            <button onclick="closeModal()" style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer;">إغلاق</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyCCvmqKN3nYQubL6LZYtMY6UtGv-T_fOg8", authDomain: "batalaonefd.firebaseapp.com", 
        projectId: "batalaonefd", storageBucket: "batalaonefd.firebasestorage.app", 
        messagingSenderId: "346007854663", appId: "1:346007854663:web:2d508e74c073061ee31b62" 
    };

    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let master = []; let curID = "";

    // جلب البيانات مع الترتيب (مقبول -> انتظار -> مرفوض)
    onSnapshot(collection(db, "registrations"), (snap) => {
        master = [];
        snap.forEach(d => {
            const data = d.data();
            if(data.serviceType === 'مراسلة') master.push({ id: d.id, ...data });
        });

        // منطق الترتيب
        master.sort((a, b) => {
            const order = { 'تم التسجيل ✅': 1, 'قيد الانتظار ⏳': 2, 'مرفوض ❌': 3 };
            return (order[a.status] || 2) - (order[b.status] || 2);
        });

        renderTable(master);
    });

    function renderTable(dataList) {
        const body = document.getElementById('tBody');
        body.innerHTML = "";
        dataList.forEach(data => {
            const linkView = data.externalLink ? `<a href="${data.externalLink}" target="_blank" style="color:var(--primary); font-weight:bold;">فتح 🔗</a>` : '---';
            const notePreview = data.notes ? `<span class="notes-text" title="${data.notes}">${data.notes}</span>` : '<span style="color:#ccc">لا يوجد</span>';
            
            body.innerHTML += `
                <tr>
                    <td style="font-weight:bold">${data.fullName || '---'}</td>
                    <td>${data.formId || '---'}</td>
                    <td>${data.level || '---'}</td>
                    <td>${linkView}</td>
                    <td>${notePreview}</td>
                    <td><span class="status-pill" style="background:${data.status?.includes('تم') ? '#d1e7dd' : data.status?.includes('رفض') ? '#f8d7da' : '#fff3cd'}">${data.status || 'انتظار'}</span></td>
                    <td>
                        <button class="btn-action" style="background:var(--primary)" onclick="openEdit('${data.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-action" style="background:var(--danger)" onclick="delDoc('${data.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
        });
    }

    // وظيفة البحث
    window.filterTable = () => {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = master.filter(item => item.fullName.toLowerCase().includes(query));
        renderTable(filtered);
    };

    window.openEdit = (id) => {
        curID = id; const data = master.find(m => m.id === id);
        const editor = document.getElementById('editor'); editor.innerHTML = "";
        const fields = [
            { id: "fullName", label: "الاسم" }, { id: "formId", label: "الاستمارة" },
            { id: "level", label: "المستوى" }, { id: "birthDate", label: "التاريخ" },
            { id: "username", label: "المستخدم" }, { id: "password", label: "السر" },
            { id: "externalLink", label: "الرابط" }, { id: "notes", label: "ملاحظات" }
        ];
        fields.forEach(f => {
            editor.innerHTML += `<div class="input-group"><label style="font-size:12px">${f.label}</label>
                <div class="input-wrapper"><input type="text" id="inp_${f.id}" value="${data[f.id]||''}">
                <button class="copy-btn" onclick="copyText('inp_${f.id}')"><i class="fas fa-copy"></i></button></div></div>`;
        });
        setSt(data.status || 'قيد الانتظار ⏳');
        document.getElementById('editModal').style.display = 'flex';
    };

    window.copyText = (id) => {
        const inp = document.getElementById(id); inp.select(); document.execCommand("copy");
        alert("تم نسخ: " + inp.value);
    };

    window.setSt = (s) => {
        document.getElementById('selectedStatus').value = s;
        document.querySelectorAll('.opt-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(s.substring(0,2))));
    };

    window.saveData = async () => {
        const updates = { status: document.getElementById('selectedStatus').value };
        document.querySelectorAll('#editor input').forEach(i => updates[i.id.replace('inp_','')] = i.value);
        await updateDoc(doc(db, "registrations", curID), updates);
        closeModal();
    };

    window.closeModal = () => document.getElementById('editModal').style.display='none';
    window.delDoc = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(db, "registrations", id)); };
</script>
</body>
</html>
