<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة فضاء الأولياء</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --success: #27ae60; --danger: #c0392b; }
        body { font-family: 'Cairo', sans-serif; background: #fdfbf7; margin: 0; direction: rtl; }
        
        .header { background: var(--primary); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: rgba(255, 255, 255, 0.2); color: white; text-decoration: none; padding: 8px 20px; border-radius: 10px; font-weight: bold; }

        .search-container { padding: 20px 40px; background: white; border-bottom: 1px solid #e3e6f0; }
        .search-input { width: 100%; padding: 12px 20px; border: 2px solid #eaecf4; border-radius: 10px; font-family: 'Cairo'; font-size: 16px; outline: none; }

        .table-container { padding: 20px 40px; overflow-x: auto; }
        table { width: 100%; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #f1f4f9; color: #333; font-weight: 900; }
        
        .status-pill { padding: 4px 12px; border-radius: 50px; font-weight: bold; font-size: 12px; }

        /* Modal */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:20px; width:95%; max-width:500px; }
        .editor-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; width: 100%; box-sizing: border-box;}
        
        .btn-action { border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: white; margin: 0 2px; }
        .copy-btn { background: #eee; border: none; cursor: pointer; padding: 5px; border-radius: 5px; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h2><i class="fas fa-users-cog"></i> طلبات فضاء الأولياء</h2>
        <a href="index.html" class="back-btn">الرئيسية</a>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث بالاسم أو الهاتف..." onkeyup="filterTable()">
    </div>

    <div class="table-container">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>الولي</th>
                    <th>الهاتف</th>
                    <th>الإيميل</th>
                    <th>الكود (السر)</th>
                    <th>ملاحظات</th>
                    <th>الحالة</th>
                    <th>تحكم</th>
                </tr>
            </thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>تعديل البيانات 🖊️</h3>
            <div id="editor" class="editor-grid"></div>
            
            <div style="margin-top:20px;">
                <label>تغيير الحالة:</label>
                <select id="statusSelect" style="width:100%; padding:10px; margin-top:5px; font-family:'Cairo'">
                    <option value="قيد الانتظار ⏳">قيد الانتظار ⏳</option>
                    <option value="تم التسجيل ✅">تم التسجيل ✅</option>
                    <option value="مرفوض ❌">مرفوض ❌</option>
                </select>
            </div>

            <button onclick="saveData()" style="width:100%; background:var(--primary); color:white; padding:12px; border:none; border-radius:10px; margin-top:15px; cursor:pointer;">حفظ</button>
            <button onclick="closeModal()" style="width:100%; background:transparent; border:none; margin-top:10px; cursor:pointer; color:red;">إغلاق</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyCCvmqKN3nYQubL6LZYtMY6UtGv-T_fOg8", authDomain: "batalaonefd.firebaseapp.com", 
        projectId: "batalaonefd", storageBucket: "batalaonefd.firebasestorage.app", 
        messagingSenderId: "346007854663", appId: "1:346007854663:web:2d508e74c073061ee31b62" 
    };

    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let master = []; let curID = "";

    onSnapshot(collection(db, "registrations"), (snap) => {
        master = [];
        snap.forEach(d => {
            const data = d.data();
            if(data.serviceType === 'فضاء_الأولياء') {
                master.push({ id: d.id, ...data });
            }
        });
        renderTable(master);
    });

    function renderTable(dataList) {
        const body = document.getElementById('tBody');
        body.innerHTML = "";
        dataList.forEach(data => {
            body.innerHTML += `
                <tr>
                    <td>${data.fullName}</td>
                    <td><a href="tel:${data.phone}" style="text-decoration:none; color:#333">${data.phone}</a></td>
                    <td>${data.email || '-'}</td>
                    <td style="font-family:monospace; font-weight:bold; color:var(--accent); direction:ltr">${data.code || '-'}</td>
                    <td>${data.notes || '-'}</td>
                    <td><span class="status-pill" style="background:${data.status.includes('تم')?'#d4edda':'#fff3cd'}">${data.status}</span></td>
                    <td>
                        <button class="btn-action" style="background:var(--primary)" onclick="openEdit('${data.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-action" style="background:var(--danger)" onclick="delDoc('${data.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
        });
    }

    window.filterTable = () => {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = master.filter(item => 
            (item.fullName && item.fullName.toLowerCase().includes(query)) ||
            (item.phone && item.phone.includes(query))
        );
        renderTable(filtered);
    };

    window.openEdit = (id) => {
        curID = id; 
        const data = master.find(m => m.id === id);
        const editor = document.getElementById('editor'); 
        editor.innerHTML = "";
        
        const fields = [
            { id: "fullName", label: "الاسم الكامل" },
            { id: "phone", label: "رقم الهاتف" },
            { id: "email", label: "الإيميل" },
            { id: "code", label: "الكود (كلمة السر)" },
            { id: "notes", label: "ملاحظات" }
        ];

        fields.forEach(f => {
            editor.innerHTML += `
            <div class="input-group">
                <label style="font-size:12px; font-weight:bold">${f.label}</label>
                <div style="display:flex">
                    <input type="text" id="inp_${f.id}" value="${data[f.id]||''}">
                    <button class="copy-btn" onclick="copyText('inp_${f.id}')">📋</button>
                </div>
            </div>`;
        });

        document.getElementById('statusSelect').value = data.status;
        document.getElementById('editModal').style.display = 'flex';
    };

    window.copyText = (id) => {
        const inp = document.getElementById(id);
        inp.select();
        document.execCommand("copy");
    };

    window.saveData = async () => {
        const updates = { status: document.getElementById('statusSelect').value };
        document.querySelectorAll('#editor input').forEach(i => updates[i.id.replace('inp_','')] = i.value);
        await updateDoc(doc(db, "registrations", curID), updates);
        closeModal();
    };

    window.closeModal = () => document.getElementById('editModal').style.display='none';
    window.delDoc = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(db, "registrations", id)); };
</script>
</body>
</html>
