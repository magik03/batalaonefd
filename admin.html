<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الإداري الشامل - النسخة الملكية 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;400;700;900&family=Changa:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================================
           1. المتغيرات والأساسيات (Global Root & Variables)
           ============================================================ */
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
            --success-color: #1cc88a;
            --info-color: #36b9cc;
            --warning-color: #f6c23e;
            --danger-color: #e74a3b;
            --purple-copy: #6f42c1;
            --white: #ffffff;
            --dark-text: #2c3e50;
            --light-bg: #f8f9fc;
            --shadow-lg: 0 1rem 3rem rgba(0,0,0,0.175);
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================================
           2. تنسيق الجسم (Base Global Styling)
           ============================================================ */
        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #eff2f7;
            margin: 0;
            padding: 30px;
            color: var(--dark-text);
            direction: rtl;
            overflow-x: hidden;
        }

        .main-container {
            max-width: 1700px;
            margin: 0 auto;
        }

        /* ============================================================
           3. الترويسة العلوية (Header Architecture)
           ============================================================ */
        .header-panel {
            background: linear-gradient(135deg, #ffffff 0%, #f1f4ff 100%);
            padding: 45px;
            border-radius: 30px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 15px solid var(--primary-color);
            position: relative;
        }

        .header-panel h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            color: var(--primary-color);
            font-family: 'Changa', sans-serif;
        }

        .header-panel p {
            margin: 12px 0 0;
            font-size: 18px;
            color: var(--secondary-color);
            font-weight: 600;
        }

        /* ============================================================
           4. أزرار التحكم الرئيسية (Main Control Buttons)
           ============================================================ */
        .control-group {
            display: flex;
            gap: 15px;
        }

        .btn-action {
            padding: 15px 30px;
            border-radius: 15px;
            border: none;
            font-family: 'Cairo';
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-export { background-color: var(--success-color); }
        .btn-import { background-color: var(--primary-color); }
        
        .btn-action:hover {
            transform: translateY(-5px);
            filter: brightness(1.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* ============================================================
           5. نظام التبويبات (Professional Tabbed Navigation)
           ============================================================ */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: -2px;
        }

        .tab-btn {
            padding: 22px 50px;
            background-color: #d1d9e6;
            border: none;
            border-radius: 20px 20px 0 0;
            cursor: pointer;
            font-family: 'Cairo';
            font-weight: 800;
            font-size: 18px;
            color: #777;
            transition: var(--transition-smooth);
        }

        .tab-btn.active {
            background-color: var(--white);
            color: var(--primary-color);
            border-top: 6px solid var(--primary-color);
            box-shadow: 0 -10px 20px rgba(0,0,0,0.05);
        }

        /* ============================================================
           6. منطقة عرض الجداول (Table Display Section)
           ============================================================ */
        .content-panel {
            background-color: var(--white);
            border-radius: 0 30px 30px 30px;
            box-shadow: var(--shadow-lg);
            padding: 40px;
            min-height: 700px;
            border: 1px solid #e3e6f0;
        }

        .search-bar {
            width: 100%;
            padding: 15px 25px;
            margin-bottom: 30px;
            border: 2px solid #eaecf4;
            border-radius: 15px;
            font-family: 'Cairo';
            font-size: 16px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1400px;
        }

        th {
            background-color: #f8f9fc;
            padding: 25px 15px;
            color: var(--secondary-color);
            font-weight: 800;
            font-size: 14px;
            border-bottom: 4px solid #eee;
            text-align: center;
        }

        td {
            padding: 20px 15px;
            border-bottom: 1px solid #f1f4f9;
            text-align: center;
            font-size: 15px;
            transition: var(--transition-smooth);
        }

        /* ============================================================
           7. أزرار النسخ لكل مادة (Copy Per Item)
           ============================================================ */
        .copy-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f3f9;
            padding: 4px 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .copy-wrapper:hover {
            background: #e2e6f0;
        }

        .mini-copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: var(--purple-copy);
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-copy-btn:hover {
            transform: scale(1.2);
            color: var(--primary-color);
        }

        .full-copy-btn {
            background: var(--purple-copy);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-family: 'Cairo';
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
        }

        /* ============================================================
           8. شارات الحالة وإشعارات النسخ (Status & Toasts)
           ============================================================ */
        .status-pill {
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-family: 'Cairo';
            border: 2px solid transparent;
            cursor: pointer;
            width: 150px;
        }

        .pill-wait { background: #fff3cd; color: #856404; border-color: #ffeeba; }
        .pill-done { background: #d4edda; color: #155724; border-color: #c3e6cb; }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 15px;
            padding: 20px;
            position: fixed;
            z-index: 99999;
            left: 50%;
            bottom: 50px;
            transform: translateX(-50%);
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #toast.show {
            visibility: visible;
            animation: fadeInOut 2.5s;
        }

        @keyframes fadeInOut {
            from {bottom: 0; opacity: 0;}
            to {bottom: 50px; opacity: 1;}
        }

        /* ============================================================
           9. نافذة التعديل المنبثقة (Modal Architecture)
           ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 9999;
            backdrop-filter: blur(10px);
            overflow-y: auto;
            padding: 60px 0;
        }

        .modal-box {
            background: var(--white);
            width: 90%;
            max-width: 650px;
            margin: auto;
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .field-group { margin-bottom: 20px; text-align: right; }
        .field-group label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 10px; }
        .field-group input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; font-family: 'Cairo'; }

        /* الأزرار داخل الصفوف */
        .btn-row { padding: 8px 15px; border-radius: 8px; border: none; color: white; cursor: pointer; font-family: 'Cairo'; font-weight: 700; margin: 0 3px; }
        .btn-row-edit { background: var(--info-color); }
        .btn-row-del { background: var(--danger-color); }

        code { background: #eee; padding: 2px 6px; border-radius: 5px; color: #d63384; font-weight: bold; }
    </style>
</head>
<body>

<div id="toast">تم النسخ بنجاح! 📋</div>

<div class="main-container">

    <header class="header-panel">
        <div class="header-info">
            <h1>لوحة الإدارة الفاخرة 🏢</h1>
            <p>نظام النسخ السريع وإدارة ملفات البطالة والمراسلة 2026</p>
        </div>
        <div class="control-group">
            <button class="btn-action btn-export" onclick="triggerDatabaseExport()">📥 تصدير ملف OneDrive</button>
            <button class="btn-action btn-import" onclick="document.getElementById('importTrigger').click()">📤 استيراد الملف</button>
            <input type="file" id="importTrigger" style="display:none" onchange="triggerDatabaseImport(event)">
        </div>
    </header>

    <div class="tabs-container">
        <button class="tab-btn active" id="tab-mora" onclick="setService('مراسلة')">🎓 ملفات المراسلة</button>
        <button class="tab-btn" id="tab-bata" onclick="setService('بطالة')">💰 منحة البطالة</button>
    </div>

    <div class="content-panel">
        <input type="text" class="search-bar" id="searchIn" placeholder="ابحث بالاسم أو رقم الهاتف للوصول السريع..." onkeyup="refreshDisplay()">
        
        <div class="table-responsive">
            <table>
                <thead id="tblHead"></thead>
                <tbody id="tblBody"></tbody>
            </table>
        </div>
    </div>

</div>

<div id="editModal" class="modal-overlay">
    <div class="modal-box">
        <h2 style="color:var(--primary-color); font-weight:900; margin-top:0; border-bottom:3px solid #eee; padding-bottom:15px;">تعديل البيانات ✍️</h2>
        <input type="hidden" id="editIdx">
        <div id="dynamicInputs"></div>
        <button class="btn-action" style="background:var(--success-color); width:100%; padding:18px; margin-top:15px; font-size:18px;" onclick="saveFinal()">حفظ التعديلات النهائية ✅</button>
        <button class="btn-action" style="background:var(--secondary-color); width:100%; margin-top:10px;" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<script>
    /* ============================================================
       10. البرمجة المنطقية المتقدمة (Advanced Engine)
       ============================================================ */

    let currentSection = 'مراسلة';
    const statusOpts = ["قيد الانتظار", "تم تسجيله", "ملف ناقص"];
    const statusMap = { "قيد الانتظار": "pill-wait", "تم تسجيله": "pill-done", "ملف ناقص": "pill-wait" };

    function setService(s) {
        currentSection = s;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(s === 'مراسلة') document.getElementById('tab-mora').classList.add('active');
        else document.getElementById('tab-bata').classList.add('active');
        refreshDisplay();
    }

    // دالة إنشاء عنصر النسخ بجانب كل معلومة
    function createCopyable(text) {
        if(!text || text === '---') return '---';
        return `
            <div class="copy-wrapper">
                <span>${text}</span>
                <button class="mini-copy-btn" title="نسخ هذه المعلومة" onclick="copyToClipboard('${text}')">📋</button>
            </div>
        `;
    }

    function refreshDisplay() {
        const fullDB = JSON.parse(localStorage.getItem('students')) || [];
        const searchVal = document.getElementById('searchIn').value.toLowerCase();
        
        const filtered = fullDB.filter(item => {
            const matchesTab = item.serviceType === currentSection;
            const matchesSearch = item.fullName.toLowerCase().includes(searchVal) || 
                                 (item.phone && item.phone.includes(searchVal)) ||
                                 (item.nin && item.nin.includes(searchVal));
            return matchesTab && matchesSearch;
        });

        const head = document.getElementById('tblHead');
        const body = document.getElementById('tblBody');
        body.innerHTML = '';

        if(currentSection === 'مراسلة') {
            head.innerHTML = `<tr><th>الاسم الكامل</th><th>المستوى</th><th>الاستمارة</th><th>المستخدم</th><th>كلمة السر</th><th>الحالة</th><th>إجراءات</th></tr>`;
        } else {
            head.innerHTML = `<tr><th>الاسم بالعربية</th><th>الاسم بالفرنسية</th><th>NIN</th><th>الهاتف</th><th>الشيك (RIP)</th><th>الحالة</th><th>إجراءات</th></tr>`;
        }

        if(filtered.length === 0) {
            body.innerHTML = `<tr><td colspan="7" style="padding:100px; font-weight:900; color:#ccc;">لا توجد سجلات حالياً</td></tr>`;
            return;
        }

        filtered.forEach((item) => {
            const gIdx = fullDB.findIndex(x => x.id === item.id);
            let row = `<tr>`;
            
            if(currentSection === 'مراسلة') {
                row += `
                    <td><b>${item.fullName}</b></td>
                    <td>${createCopyable(item.level)}</td>
                    <td>${createCopyable(item.formId)}</td>
                    <td>${createCopyable(item.username)}</td>
                    <td>${createCopyable(item.password)}</td>
                `;
            } else {
                row += `
                    <td><b>${item.fullName}</b></td>
                    <td style="text-transform:uppercase">${createCopyable(item.nameFr)}</td>
                    <td>${createCopyable(item.nin)}</td>
                    <td>${createCopyable(item.phone)}</td>
                    <td>${createCopyable(item.rip)}</td>
                `;
            }

            row += `
                <td>
                    <select class="status-pill ${statusMap[item.status]}" onchange="quickUpdateStat(${gIdx}, this.value)">
                        ${statusOpts.map(o => `<option value="${o}" ${item.status===o?'selected':''}>${o}</option>`).join('')}
                    </select>
                </td>
                <td style="white-space:nowrap">
                    <button class="full-copy-btn" onclick="copyFullRecord(${gIdx})">📋 نسخ الكل</button>
                    <button class="btn-row btn-row-edit" onclick="openEdit(${gIdx})">تعديل</button>
                    <button class="btn-row btn-row-del" onclick="delRow(${gIdx})">حذف</button>
                </td>
            </tr>`;
            body.innerHTML += row;
        });
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            showToast();
        });
    }

    function copyFullRecord(idx) {
        const item = JSON.parse(localStorage.getItem('students'))[idx];
        let str = `--- ملف ${item.serviceType} ---\n`;
        str += `الاسم: ${item.fullName}\n`;
        if(item.serviceType === 'مراسلة') {
            str += `المستوى: ${item.level}\nرقم الاستمارة: ${item.formId}\nالمستخدم: ${item.username}\nكلمة السر: ${item.password}`;
        } else {
            str += `الاسم FR: ${item.nameFr}\nNIN: ${item.nin}\nالهاتف: ${item.phone}\nالشيك: ${item.rip}`;
        }
        copyToClipboard(str);
    }

    function showToast() {
        const t = document.getElementById("toast");
        t.className = "show";
        setTimeout(() => { t.className = t.className.replace("show", ""); }, 2500);
    }

    function openEdit(idx) {
        const item = JSON.parse(localStorage.getItem('students'))[idx];
        document.getElementById('editIdx').value = idx;
        const container = document.getElementById('dynamicInputs');
        container.innerHTML = `<div class="field-group"><label>الاسم (عربي):</label><input type="text" id="e_name" value="${item.fullName}"></div>`;

        if(item.serviceType === 'مراسلة') {
            container.innerHTML += `
                <div class="field-group"><label>المستوى:</label><input type="text" id="e_lvl" value="${item.level}"></div>
                <div class="field-group"><label>الاستمارة:</label><input type="text" id="e_fid" value="${item.formId}"></div>
                <div class="field-group"><label>المستخدم:</label><input type="text" id="e_usr" value="${item.username}"></div>
                <div class="field-group"><label>كلمة المرور:</label><input type="text" id="e_pas" value="${item.password}"></div>
            `;
        } else {
            container.innerHTML += `
                <div class="field-group"><label>الاسم FR:</label><input type="text" id="e_fr" value="${item.nameFr}"></div>
                <div class="field-group"><label>NIN:</label><input type="text" id="e_nin" value="${item.nin}"></div>
                <div class="field-group"><label>الهاتف:</label><input type="text" id="e_tel" value="${item.phone}"></div>
                <div class="field-group"><label>رقم الشيك:</label><input type="text" id="e_rip" value="${item.rip}"></div>
            `;
        }
        document.getElementById('editModal').style.display = 'block';
    }

    function saveFinal() {
        const idx = document.getElementById('editIdx').value;
        let db = JSON.parse(localStorage.getItem('students'));
        const type = db[idx].serviceType;
        db[idx].fullName = document.getElementById('e_name').value;

        if(type === 'مراسلة') {
            db[idx].level = document.getElementById('e_lvl').value;
            db[idx].formId = document.getElementById('e_fid').value;
            db[idx].username = document.getElementById('e_usr').value;
            db[idx].password = document.getElementById('e_pas').value;
        } else {
            db[idx].nameFr = document.getElementById('e_fr').value;
            db[idx].nin = document.getElementById('e_nin').value;
            db[idx].phone = document.getElementById('e_tel').value;
            db[idx].rip = document.getElementById('e_rip').value;
        }
        localStorage.setItem('students', JSON.stringify(db));
        closeModal(); refreshDisplay();
    }

    function triggerDatabaseExport() {
        const blob = new Blob([localStorage.getItem('students')], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `بيانات_التصدير_${new Date().toLocaleDateString()}.json`; a.click();
    }

    function triggerDatabaseImport(event) {
        const file = event.target.files[0];
        const r = new FileReader();
        r.onload = (e) => { localStorage.setItem('students', e.target.result); refreshDisplay(); alert('تم الاستيراد!'); };
        r.readAsText(file);
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
    function delRow(idx) { if(confirm('حذف السجل؟')) { let d = JSON.parse(localStorage.getItem('students')); d.splice(idx,1); localStorage.setItem('students', JSON.stringify(d)); refreshDisplay(); } }
    function quickUpdateStat(idx, val) { let d = JSON.parse(localStorage.getItem('students')); d[idx].status = val; localStorage.setItem('students', JSON.stringify(d)); refreshDisplay(); }

    window.onload = refreshDisplay;
</script>

</body>
</html>
