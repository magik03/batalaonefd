<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الإدارة الاحترافية v15.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4e73df; --dark: #2d3436; --success: #1cc88a; --danger: #e74a3b; }
        body { font-family: 'Cairo', sans-serif; background: #f8f9fc; margin: 0; direction: rtl; }
        header { background: var(--dark); color: white; padding: 20px; text-align: center; font-weight: 900; font-size: 22px; }
        .container { padding: 30px; max-width: 1300px; margin: auto; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; flex: 1; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; border-right: 5px solid var(--primary); }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        th { background: #f1f4f9; padding: 15px; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }
        .btn { padding: 7px 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; margin: 2px; }
        .btn-edit { background: var(--primary); color: white; }
        .btn-del { background: var(--danger); color: white; }
        
        /* Modal */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; backdrop-filter: blur(5px); }
        .modal-content { background:white; padding:30px; border-radius:20px; width:90%; max-width:600px; max-height: 85vh; overflow-y: auto; }
        .edit-input { display: flex; flex-direction: column; margin-bottom: 15px; }
        .edit-input label { font-weight: bold; font-size: 13px; color: #666; }
        .edit-input input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; }
    </style>
</head>
<body>

<header>لوحة إدارة البيانات السحابية 🔐</header>

<div class="container">
    <div class="stats">
        <div class="stat-card"><h3>الإجمالي</h3><p id="cAll">0</p></div>
        <div class="stat-card"><h3>مراسلة</h3><p id="cMora">0</p></div>
        <div class="stat-card"><h3>بطالة</h3><p id="cBata">0</p></div>
    </div>
    <table>
        <thead>
            <tr>
                <th>النوع</th>
                <th>الاسم</th>
                <th>التواصل/الملف</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="tBody"></tbody>
    </table>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--primary)">تعديل بيانات السجل</h2>
        <div id="editor"></div>
        <button class="btn btn-edit" style="width:100%; padding:15px; font-size:18px;" onclick="saveData()">حفظ التعديلات في السحابة ✅</button>
        <button class="btn" style="width:100%; margin-top:10px; background:#eee;" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCCvmqKN3nYQubL6LZYtMY6UtGv-T_fOg8",
        authDomain: "batalaonefd.firebaseapp.com",
        projectId: "batalaonefd",
        storageBucket: "batalaonefd.firebasestorage.app",
        messagingSenderId: "346007854663",
        appId: "1:346007854663:web:2d508e74c073061ee31b62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let master = {}; let curID = "";

    onSnapshot(collection(db, "registrations"), (snap) => {
        const body = document.getElementById('tBody'); body.innerHTML = "";
        let counts = { a: 0, m: 0, b: 0 };
        snap.forEach(d => {
            const data = d.data(); master[d.id] = data;
            counts.a++; if(data.serviceType==='مراسلة') counts.m++; else counts.b++;
            body.innerHTML += `
                <tr>
                    <td>${data.serviceType}</td>
                    <td><b>${data.fullName || data.nameFr}</b></td>
                    <td>${data.phone || data.formId}</td>
                    <td>${data.status}</td>
                    <td>
                        <button class="btn btn-edit" onclick="openEdit('${d.id}')">تعديل/معاينة</button>
                        <button class="btn btn-del" onclick="delDoc('${d.id}')">حذف</button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('cAll').innerText = counts.a;
        document.getElementById('cMora').innerText = counts.m;
        document.getElementById('cBata').innerText = counts.b;
    });

    window.openEdit = (id) => {
        curID = id; const data = master[id]; const editor = document.getElementById('editor'); editor.innerHTML = "";
        const labels = { fullName:"الاسم (ع)", nameFr:"الاسم (ف)", formId:"رقم الاستمارة", level:"المستوى", username:"المستخدم", password:"كلمة السر", nin:"NIN", phone:"الهاتف", rip:"RIP", anemId:"ANEM", notes:"ملاحظات", status:"الحالة" };
        for(let key in data) {
            if(labels[key]) editor.innerHTML += `<div class="edit-input"><label>${labels[key]}</label><input type="text" id="inp_${key}" value="${data[key]||''}"></div>`;
        }
        document.getElementById('editModal').style.display = 'flex';
    };

    window.saveData = async () => {
        const updates = {}; document.querySelectorAll('#editor input').forEach(i => { updates[i.id.replace('inp_','')] = i.value; });
        await updateDoc(doc(db, "registrations", curID), updates);
        alert("تم التحديث!"); closeModal();
    };

    window.closeModal = () => document.getElementById('editModal').style.display='none';
    window.delDoc = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(db, "registrations", id)); };
</script>
</body>
</html>
