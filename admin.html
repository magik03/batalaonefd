<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة سوبير إعلام آلي v15.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4e73df; --dark: #2d3436; --success: #1cc88a; 
            --danger: #e74a3b; --warning: #f6c23e; --info: #36b9cc;
            --gray: #858796; --light: #f8f9fc;
        }
        
        body { 
            font-family: 'Cairo', sans-serif; background: var(--light); 
            margin: 0; direction: rtl; color: #333; overflow-x: hidden;
        }

        header { 
            background: linear-gradient(135deg, var(--dark) 0%, #1a1a1a 100%); 
            color: white; padding: 25px; text-align: center; 
            font-weight: 900; font-size: 26px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .container { padding: 40px; max-width: 1400px; margin: auto; }

        /* كروت الإحصائيات */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 25px; margin-bottom: 40px; 
        }

        .stat-card { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); text-align: center; 
            border-bottom: 5px solid var(--primary); transition: 0.3s;
        }

        .stat-card:hover { transform: translateY(-8px); }
        .stat-card h3 { margin: 0; font-size: 18px; color: var(--gray); text-transform: uppercase; }
        .stat-card p { margin: 15px 0 0; font-size: 35px; font-weight: 900; color: var(--dark); }

        /* منطقة الجدول */
        .table-section {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        .table-header {
            padding: 20px 30px; background: #fff; border-bottom: 1px solid #edf0f5;
            display: flex; justify-content: space-between; align-items: center;
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            background: #f8f9fc; padding: 20px; font-size: 15px; 
            color: var(--primary); text-align: center; border-bottom: 2px solid #e3e6f0;
        }

        td { padding: 18px; border-bottom: 1px solid #f1f1f1; text-align: center; font-size: 16px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #fcfdff; }

        /* الحالات الملونة */
        .status-pill {
            display: inline-block; padding: 6px 18px; border-radius: 50px;
            font-size: 13px; font-weight: bold; border: 1px solid transparent;
        }

        /* الأزرار */
        .btn { 
            padding: 10px 20px; border: none; border-radius: 10px; 
            cursor: pointer; font-family: 'Cairo'; font-weight: bold; 
            transition: all 0.3s ease;
        }

        .btn-edit { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(78,115,223,0.3); }
        .btn-edit:hover { background: #2e59d9; transform: scale(1.05); }
        .btn-del { background: var(--danger); color: white; margin-right: 8px; }
        .btn-del:hover { background: #be2617; }

        /* نافذة التعديل (Modal) */
        .modal { 
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); 
            z-index:1000; justify-content:center; align-items:center; backdrop-filter: blur(10px); 
        }

        .modal-content { 
            background:white; padding:40px; border-radius:30px; width:95%; 
            max-width:800px; max-height: 90vh; overflow-y: auto; position: relative;
        }

        .modal-title { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 25px; border-bottom: 3px solid #f1f4f9; padding-bottom: 10px; }

        .edit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-weight: bold; font-size: 14px; color: #555; margin-bottom: 8px; }
        .input-group input { padding: 14px; border: 1px solid #d1d3e2; border-radius: 12px; font-family: 'Cairo'; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 0.25rem rgba(78,115,223,0.1); }
        
        /* أزرار الحالة الجاهزة */
        .status-selector { grid-column: span 2; margin-top: 15px; padding: 20px; background: #f8f9fc; border-radius: 15px; }
        .status-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
        .opt-btn { 
            flex: 1; min-width: 140px; padding: 12px; border-radius: 10px; border: 2px solid transparent;
            cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s; text-align: center;
        }
        .full-span { grid-column: span 2; }

    </style>
</head>
<body>

<header>لوحة تحكم سوبير إعلام آلي - بلدية قصر الحيران 🛡️</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><h3>إجمالي المسجلين</h3><p id="cAll">0</p></div>
        <div class="stat-card" style="border-bottom-color: var(--info);"><h3>قسم المراسلة</h3><p id="cMora">0</p></div>
        <div class="stat-card" style="border-bottom-color: var(--warning);"><h3>منحة البطالة</h3><p id="cBata">0</p></div>
    </div>

    <div class="table-section">
        <div class="table-header">
            <h2 style="margin:0; font-size:20px;">قائمة الطلبات السحابية</h2>
        </div>
        <table>
            <thead>
                <tr>
                    <th>نوع الخدمة</th>
                    <th>اسم الزبون الكامل</th>
                    <th>رقم التواصل/الملف</th>
                    <th>وضعية الملف</th>
                    <th>العمليات</th>
                </tr>
            </thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">تعديل ملف الزبون 🖊️</div>
        <div id="editor" class="edit-grid"></div>
        <div style="margin-top:35px; display:flex; gap:15px;">
            <button class="btn btn-edit" style="flex:2; padding:18px;" onclick="saveData()">تأكيد وحفظ التغييرات ✅</button>
            <button class="btn" style="flex:1; background:#eaecf4; color:#5a5c69;" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCCvmqKN3nYQubL6LZYtMY6UtGv-T_fOg8",
        authDomain: "batalaonefd.firebaseapp.com",
        projectId: "batalaonefd",
        storageBucket: "batalaonefd.firebasestorage.app",
        messagingSenderId: "346007854663",
        appId: "1:346007854663:web:2d508e74c073061ee31b62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let master = {}; let curID = "";

    const statusMap = {
        'قيد الانتظار ⏳': { bg: '#fff3cd', co: '#856404', br: '#ffc107' },
        'تم التسجيل ✅': { bg: '#d1e7dd', co: '#0f5132', br: '#198754' },
        'ناقص وثائق ⚠️': { bg: '#cfe2ff', co: '#084298', br: '#0d6efd' },
        'مرفوض ❌': { bg: '#f8d7da', co: '#842029', br: '#dc3545' }
    };

    const getStatusStyle = (t) => {
        const s = statusMap[t] || { bg: '#e2e3e5', co: '#383d41', br: '#6c757d' };
        return `background:${s.bg}; color:${s.co}; border:1px solid ${s.br};`;
    };

    onSnapshot(collection(db, "registrations"), (snap) => {
        const body = document.getElementById('tBody'); body.innerHTML = "";
        let counts = { a: 0, m: 0, b: 0 };

        snap.forEach(d => {
            const data = d.data(); master[d.id] = data;
            counts.a++; 
            if(data.serviceType === 'مراسلة') counts.m++; else counts.b++;
            
            body.innerHTML += `
                <tr>
                    <td><span style="font-weight:bold; color:var(--primary)">${data.serviceType || 'عام'}</span></td>
                    <td><b>${data.fullName || data.nameFr}</b></td>
                    <td>${data.phone || data.formId || '---'}</td>
                    <td><span class="status-pill" style="${getStatusStyle(data.status)}">${data.status || 'قيد الانتظار ⏳'}</span></td>
                    <td>
                        <button class="btn btn-edit" onclick="openEdit('${d.id}')">تعديل</button>
                        <button class="btn btn-del" onclick="delDoc('${d.id}')">حذف</button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('cAll').innerText = counts.a;
        document.getElementById('cMora').innerText = counts.m;
        document.getElementById('cBata').innerText = counts.b;
    });

    window.openEdit = (id) => {
        curID = id; const data = master[id]; 
        const editor = document.getElementById('editor'); editor.innerHTML = "";
        
        const labels = { 
            fullName: "الاسم (ع)", nameFr: "الاسم (ف)", formId: "رقم الملف", 
            level: "المستوى", username: "المستخدم", password: "كلمة السر", 
            nin: "NIN", phone: "الهاتف", rip: "RIP", anemId: "ANEM", notes: "ملاحظات"
        };

        for(let key in labels) {
            editor.innerHTML += `
                <div class="input-group ${key === 'notes' ? 'full-span' : ''}">
                    <label>${labels[key]}</label>
                    <input type="text" id="inp_${key}" value="${data[key] || ''}">
                </div>`;
        }

        let statusBtnsHTML = `
            <div class="status-selector full-span">
                <label>تحديث الحالة بنقرة واحدة:</label>
                <div class="status-btns">`;
        
        Object.keys(statusMap).forEach(statusTitle => {
            const config = statusMap[statusTitle];
            const isSel = data.status === statusTitle ? `border-color:#000; box-shadow:0 0 10px ${config.br};` : '';
            statusBtnsHTML += `
                <div class="opt-btn" style="background:${config.bg}; color:${config.co}; ${isSel}" 
                     onclick="setSt('${statusTitle}')">${statusTitle}</div>`;
        });
        
        statusBtnsHTML += `</div><input type="hidden" id="inp_status" value="${data.status || 'قيد الانتظار ⏳'}"></div>`;
        editor.innerHTML += statusBtnsHTML;

        document.getElementById('editModal').style.display = 'flex';
    };

    window.setSt = (v) => {
        document.getElementById('inp_status').value = v;
        document.querySelectorAll('.opt-btn').forEach(b => b.style.borderColor = 'transparent');
        event.target.style.borderColor = '#000';
    };

    window.saveData = async () => {
        const updates = {};
        document.querySelectorAll('#editor input').forEach(i => { updates[i.id.replace('inp_','')] = i.value; });
        try {
            await updateDoc(doc(db, "registrations", curID), updates);
            closeModal();
        } catch (e) { alert("حدث خطأ في الشبكة!"); }
    };

    window.closeModal = () => document.getElementById('editModal').style.display='none';
    window.delDoc = async (id) => { if(confirm("حذف ملف الزبون نهائياً؟")) await deleteDoc(doc(db, "registrations", id)); };
</script>
</body>
</html>
