<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة سوبير إعلام آلي 🔐</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4e73df; --dark: #2d3436; --success: #1cc88a; --danger: #e74a3b; }
        body { font-family: 'Cairo', sans-serif; background: #f8f9fc; margin: 0; direction: rtl; }
        
        header { 
            background: var(--dark); color: white; padding: 20px; text-align: center; 
            font-weight: 900; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .container { padding: 30px; max-width: 1400px; margin: auto; }
        
        /* كروت الإحصائيات */
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: white; padding: 25px; flex: 1; border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; border-right: 6px solid var(--primary);
        }

        /* الجدول */
        .table-box { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f4f9; padding: 15px; font-size: 14px; color: var(--primary); }
        td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; font-size: 14px; }
        
        .status-pill { padding: 5px 12px; border-radius: 50px; font-weight: bold; font-size: 12px; }
        .btn { padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.3s; }
        .btn-del { background: var(--danger); color: white; }
        .btn-link { background: #36b9cc; color: white; text-decoration: none; padding: 4px 8px; border-radius: 5px; font-size: 11px; }

        /* نافذة التعديل */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; backdrop-filter: blur(5px); }
        .modal-content { background:white; padding:35px; border-radius:25px; width:90%; max-width:700px; max-height: 85vh; overflow-y: auto; }
        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .field { display: flex; flex-direction: column; margin-bottom: 10px; }
        .field label { font-weight: bold; font-size: 13px; color: #666; margin-bottom: 5px; }
        .field input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Cairo'; }
    </style>
</head>
<body>

<header>لوحة الإدارة السحابية - سوبير إعلام آلي 🛡️</header>

<div class="container">
    <div class="stats">
        <div class="stat-card"><h3>إجمالي الطلبات</h3><p id="cAll">0</p></div>
        <div class="stat-card" style="border-right-color: #36b9cc;"><h3>المراسلة</h3><p id="cMora">0</p></div>
        <div class="stat-card" style="border-right-color: #f6c23e;"><h3>البطالة</h3><p id="cBata">0</p></div>
    </div>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>الاسم</th>
                    <th>التواصل / الرابط</th>
                    <th>الحالة</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--primary); margin-top:0;">تعديل بيانات الزبون 🖊️</h2>
        <div id="editor" class="edit-grid"></div>
        <div style="margin-top:25px; display:flex; gap:10px;">
            <button class="btn" style="background:var(--success); color:white; flex:2;" onclick="saveData()">حفظ التعديلات ✅</button>
            <button class="btn" style="background:#eee; flex:1;" onclick="closeModal()">إغلاق</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCCvmqKN3nYQubL6LZYtMY6UtGv-T_fOg8",
        authDomain: "batalaonefd.firebaseapp.com",
        projectId: "batalaonefd",
        storageBucket: "batalaonefd.firebasestorage.app",
        messagingSenderId: "346007854663",
        appId: "1:346007854663:web:2d508e74c073061ee31b62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let master = {}; let curID = "";

    const getStatusStyle = (s) => {
        if(s === 'تم التسجيل ✅') return 'background:#d1e7dd; color:#0f5132;';
        if(s === 'مرفوض ❌') return 'background:#f8d7da; color:#842029;';
        return 'background:#fff3cd; color:#664d03;';
    };

    onSnapshot(collection(db, "registrations"), (snap) => {
        const body = document.getElementById('tBody'); body.innerHTML = "";
        let counts = { a: 0, m: 0, b: 0 };

        snap.forEach(d => {
            const data = d.data(); master[d.id] = data;
            counts.a++; 
            if(data.serviceType === 'مراسلة') counts.m++; else counts.b++;
            
            const linkTag = data.externalLink ? `<br><a href="${data.externalLink}" target="_blank" class="btn-link">فتح الرابط 🔗</a>` : '';

            body.innerHTML += `
                <tr>
                    <td><b>${data.serviceType}</b></td>
                    <td>${data.fullName || data.nameFr}</td>
                    <td>${data.phone || data.formId}${linkTag}</td>
                    <td><span class="status-pill" style="${getStatusStyle(data.status)}">${data.status || 'قيد الانتظار'}</span></td>
                    <td>
                        <button class="btn" style="background:var(--primary); color:white;" onclick="openEdit('${d.id}')">تعديل</button>
                        <button class="btn btn-del" onclick="delDoc('${d.id}')">حذف</button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('cAll').innerText = counts.a;
        document.getElementById('cMora').innerText = counts.m;
        document.getElementById('cBata').innerText = counts.b;
    });

    window.openEdit = (id) => {
        curID = id; const data = master[id]; 
        const editor = document.getElementById('editor'); editor.innerHTML = "";
        
        const labels = data.serviceType === 'مراسلة' ? 
            { fullName: "الاسم", formId: "رقم الاستمارة", level: "المستوى", username: "المستخدم", password: "السر", externalLink: "الرابط", status: "الحالة", notes: "ملاحظات" } :
            { nameFr: "الاسم (FR)", nin: "NIN", phone: "الهاتف", rip: "RIP", anemId: "ANEM", status: "الحالة", notes: "ملاحظات" };

        for(let key in labels) {
            editor.innerHTML += `<div class="field"><label>${labels[key]}</label><input type="text" id="inp_${key}" value="${data[key]||''}"></div>`;
        }
        document.getElementById('editModal').style.display = 'flex';
    };

    window.saveData = async () => {
        const updates = {}; document.querySelectorAll('#editor input').forEach(i => { updates[i.id.replace('inp_','')] = i.value; });
        await updateDoc(doc(db, "registrations", curID), updates);
        closeModal();
    };

    window.closeModal = () => document.getElementById('editModal').style.display='none';
    window.delDoc = async (id) => { if(confirm("حذف؟")) await deleteDoc(doc(db, "registrations", id)); };
</script>
</body>
</html>
