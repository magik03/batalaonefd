<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيلات الحج والعمرة 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a1a1a; --accent: #d4af37; --bg: #fdfbf7; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); margin: 0; direction: rtl; }
        
        /* الهيدر */
        .header { background: var(--primary); color: var(--accent); padding: 25px; text-align: center; border-bottom: 5px solid var(--accent); position: relative; }
        .header h2 { margin: 0; font-weight: 900; color: white; }
        
        /* زر الادمن في الاعلى */
        .admin-top-btn { 
            position: absolute; 
            left: 20px; 
            top: 50%; 
            transform: translateY(-50%);
            color: white; 
            text-decoration: none; 
            font-size: 14px; 
            background: rgba(255,255,255,0.1); 
            padding: 8px 15px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }
        .admin-top-btn:hover { background: var(--accent); color: var(--primary); border-color: var(--accent); }

        .form-container { max-width: 800px; margin: 30px auto; background: white; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); overflow: hidden; border-top: 10px solid var(--accent); }
        .form-body { padding: 35px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .field-group { flex: 1; }
        .field-group { display: flex; flex-direction: column; margin-bottom: 18px; }
        .field-group label { font-weight: 700; margin-bottom: 8px; color: var(--primary); font-size: 14px; }
        .field-group input, .field-group select, .field-group textarea { padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: 'Cairo'; font-size: 16px; outline: none; transition: 0.3s; background: white; }
        .field-group input:focus, .field-group textarea:focus { border-color: var(--accent); }
        #companionSection { background-color: #f8f9fa; padding: 20px; border-radius: 10px; border: 2px dashed var(--accent); margin-bottom: 20px; display: none; }
        .section-title { color: var(--accent); font-weight: 900; margin-bottom: 15px; }
        .submit-btn { width: 100%; padding: 18px; background: var(--primary); color: var(--accent); border: none; border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer; border: 1px solid var(--accent); transition: 0.3s; }
        .submit-btn:hover { background: var(--accent); color: white; }
        
        /* رابط العودة في الأسفل */
        .footer-nav { text-align: center; margin: 20px 0 40px; }
        .footer-nav a { text-decoration: none; color: #666; font-weight: 700; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .footer-nav a:hover { color: var(--primary); transform: translateX(-5px); }

        @media (max-width: 600px) { 
            .form-row { flex-direction: column; gap: 0; } 
            .header { padding-top: 60px; } /* مساحة للزر في الموبايل */
            .admin-top-btn { top: 15px; transform: none; left: 50%; transform: translateX(-50%); width: auto; }
        }
    </style>
</head>
<body>

<div class="header">
    <!-- زر الدخول للوحة التحكم (ضع رابط صفحة الادمن هنا) -->
    <a href="admin-hadj.html" class="admin-top-btn">
        <i class="fas fa-users-cog"></i> الدخول للإدارة
    </a>
    <h2><i class="fas fa-kaaba"></i> تسجيلات الحج والعمرة 2026</h2>
</div>

<div class="form-container">
    <div id="success-msg" style="display:none; text-align:center; padding:40px;">
        <i class="fas fa-check-circle" style="font-size: 60px; color: var(--success); margin-bottom: 20px;"></i>
        <h3>تم التسجيل بنجاح</h3>
        <button onclick="location.reload()" class="submit-btn" style="width:auto; padding: 10px 30px;">تسجيل جديد</button>
    </div>
    
    <form class="form-body" id="hajjForm">
        <h3 style="margin-top:0; color:var(--primary)">📋 بيانات مقدم الطلب</h3>
        <div class="form-row">
            <div class="field-group"><label>اللقب</label><input type="text" id="lastName" required></div>
            <div class="field-group"><label>الاسم</label><input type="text" id="firstName" required></div>
        </div>
        <div class="form-row">
            <div class="field-group"><label>رقم جواز السفر</label><input type="text" id="passportNum" maxlength="9" required></div>
            <div class="field-group"><label>رقم وصل الدفع (000000/00)</label><input type="text" id="paymentNum" maxlength="9" placeholder="000000/00" required></div>
        </div>
        <div class="form-row">
            <div class="field-group"><label>رقم الهاتف</label><input type="tel" id="phone" required></div>
            <div class="field-group"><label>اسم المجموعة</label><input type="text" id="groupName" required></div>
        </div>

        <div class="field-group">
            <label>ملاحظات إضافية (اختياري)</label>
            <textarea id="notes" rows="3" placeholder="أكتب أي ملاحظات هنا..."></textarea>
        </div>

        <hr style="border:0; border-top:1px solid #eee; margin: 20px 0;">

        <div class="field-group">
            <label style="color:var(--accent);">هل يرافقك شخص آخر؟</label>
            <select id="hasCompanion" onchange="toggleCompanion()">
                <option value="no">لا</option>
                <option value="yes">نعم</option>
            </select>
        </div>

        <div id="companionSection">
            <div class="section-title">👥 بيانات المرافق</div>
            <div class="form-row">
                <div class="field-group"><label>اللقب</label><input type="text" id="comp_lastName" class="comp-input"></div>
                <div class="field-group"><label>الاسم</label><input type="text" id="comp_firstName" class="comp-input"></div>
            </div>
            <div class="form-row">
                <div class="field-group"><label>الجواز</label><input type="text" id="comp_passportNum" maxlength="9" class="comp-input"></div>
                <div class="field-group"><label>الدفع</label><input type="text" id="comp_paymentNum" maxlength="9" class="comp-input"></div>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">إرسال التسجيل</button>
    </form>
</div>

<!-- زر العودة للرئيسية في الأسفل -->
<div class="footer-nav">
    <a href="index.html">
        <i class="fas fa-arrow-right"></i> العودة للصفحة الرئيسية
    </a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD77gThYcLxvDGXBCLuhmuH_uL0R9vuXyk",
      authDomain: "hassanaboutaha.firebaseapp.com",
      projectId: "hassanaboutaha",
      storageBucket: "hassanaboutaha.firebasestorage.app",
      messagingSenderId: "636660798298",
      appId: "1:636660798298:web:9dbe0937ec943fecc15963"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COLLECTION_NAME = "hajj_umrah_new";

    window.toggleCompanion = () => {
        const val = document.getElementById('hasCompanion').value;
        const section = document.getElementById('companionSection');
        const inputs = section.querySelectorAll('.comp-input');
        if (val === 'yes') {
            section.style.display = 'block';
            inputs.forEach(input => input.setAttribute('required', 'true'));
        } else {
            section.style.display = 'none';
            inputs.forEach(input => { input.removeAttribute('required'); input.value = ''; });
        }
    };

    document.getElementById('hajjForm').onsubmit = async (e) => {
        e.preventDefault();
        const hasComp = document.getElementById('hasCompanion').value === 'yes';
        const mainData = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            passportNum: document.getElementById('passportNum').value,
            paymentNum: document.getElementById('paymentNum').value,
            phone: document.getElementById('phone').value,
            groupName: document.getElementById('groupName').value,
            notes: document.getElementById('notes').value,
            createdAt: new Date().toISOString().split('T')[0],
            fileStatus: 'غير مؤكد ⏳',
            hasCompanion: hasComp
        };

        const payPattern = /^\d{6}\/\d{2}$/;
        if (!payPattern.test(mainData.paymentNum)) { alert("رقم دفع مقدم الطلب خطأ"); return; }

        if (hasComp) {
            mainData.comp_firstName = document.getElementById('comp_firstName').value;
            mainData.comp_lastName = document.getElementById('comp_lastName').value;
            mainData.comp_passportNum = document.getElementById('comp_passportNum').value;
            mainData.comp_paymentNum = document.getElementById('comp_paymentNum').value;
            if (!payPattern.test(mainData.comp_paymentNum)) { alert("رقم دفع المرافق خطأ"); return; }
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = 'جاري الحفظ...';
        await addDoc(collection(db, COLLECTION_NAME), mainData);
        document.getElementById('hajjForm').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
    };
</script>
</body>
</html>
